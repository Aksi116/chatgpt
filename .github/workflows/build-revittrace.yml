name: Build ZODCHI RevitTrace

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-revittrace.yml"
      - "ci/**"
      - "source_parts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build ready package
        shell: pwsh
        run: ./ci/build-ready.ps1

      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: ZODCHI-RevitTrace-R1.4-ready
          path: |
            release/ZODCHI-RevitTrace-R1.4-ready.zip
            release/ZODCHI-RevitTrace-R1.4-ready.zip.sha256
          if-no-files-found: error

      - name: Commit ready package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/ZODCHI-RevitTrace-R1.4-ready.zip release/ZODCHI-RevitTrace-R1.4-ready.zip.sha256
          if (git diff --cached --quiet) {
            Write-Host "Ready package unchanged."
          } else {
            git commit -m "Build RevitTrace R1.4 ready package [skip ci]"
            git push
          }
